type = "protected"
protected_modules = ["atlas.speech.*"]
allowed_importers = ["atlas.speech"]

[[tool.importlinter.contracts]]
name = "mcp is reached only through its package root"
type = "protected"
protected_modules = ["atlas.mcp.*"]
allowed_importers = ["atlas.mcp"]

[[tool.importlinter.contracts]]
name = "Only the mcp store touches the MCP SDK"
type = "forbidden"
source_modules = ["atlas"]
forbidden_modules = ["mcp"]
ignore_imports = ["atlas.mcp.store -> mcp", "atlas.mcp.store -> mcp.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "The core never imports an extra: ddgs only in atlas.tools.keyless"
type = "forbidden"
source_modules = ["atlas"]
forbidden_modules = ["ddgs"]
ignore_imports = ["atlas.tools.keyless -> ddgs", "atlas.tools.keyless -> ddgs.*"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "The core never imports an extra: atlas.mcp, and what it needs, only on its own"
type = "forbidden"
source_modules = [
    "atlas.agent", "atlas.assistant", "atlas.home", "atlas.models", "atlas.secrets", "atlas.server",
    "atlas.skills", "atlas.tools",
]
forbidden_modules = ["atlas.mcp", "mcp", "mcp_types", "jsonschema"]

[[tool.importlinter.contracts]]
name = "The agent's history rules are pure: the loop applies them, the store writes files"
type = "forbidden"
source_modules = ["atlas.agent.history"]
# What history.py imports itself; atlas.models brings the SDK along through its package root.
allow_indirect_imports = true
forbidden_modules = [
    "atlas.agent.service",
    "atlas.agent.store",
    "atlas.home",
    "atlas.secrets",
    "openai",
    "sqlite3",
    "subprocess",
    "socket",
    "starlette",
    "uvicorn",
    "pyrage",
]

[tool.deptry]
known_first_party = ["atlas"]
# pywinpty is installed on Windows only: elsewhere deptry cannot read its module from it.
package_module_name_map = { pywinpty = "winpty" }

[tool.deptry.per_rule_ignores]
# zoneinfo reads tzdata's files on Windows, and browser-harness runs as a program
# (atlas.browser); Atlas imports neither. The transcribe extra is imported by name, once a
# recording comes (atlas.speech.local), so a home that never gets one never loads it.
DEP002 = ["tzdata", "browser-harness", "onnx-asr", "onnxruntime", "av"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# The coverage is measured by folder, not by package: a plugin Atlas makes (`plugins/`) is imported
# under a name of its own (`atlas_plugin_<name>`), as every plugin is, and is counted all the same.
# The tests run on every core (`-n0` runs them in this process, for a debugger), and a test that
# hangs fails after five minutes instead of holding the run.
addopts = "--import-mode=importlib --strict-markers -n auto --cov=src/atlas --cov=plugins --cov-report=term-missing --cov-fail-under=90"
timeout = 300
markers = [
    "offered_executors: the plugins Atlas makes that are not on are looked at, as at a real start",
]

[tool.coverage.run]
# The Windows adapters (ACL, DPAPI) never run on Linux and cannot be imported there, so they are
# left out of the coverage floor, which every system must meet. They are proven by their tests on
# Windows, where CI runs the suite too (.github/workflows/ci.yml).
omit = ["src/atlas/*/windows.py"]
