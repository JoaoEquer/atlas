<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <title>Atlas Setup</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <main>
      <img class="icon" src="icon.svg" alt="" />
      <h1 id="title"></h1>
      <p id="text"></p>
      <p id="where" class="path"></p>
      <div id="progress" hidden>
        <div class="bar"><div></div></div>
        <p id="step"></p>
      </div>
      <section id="warnings" hidden>
        <h2 id="warnings-title"></h2>
        <ul id="warnings-list"></ul>
      </section>
      <details id="details" hidden>
        <summary id="details-label"></summary>
        <pre id="log"></pre>
      </details>
      <div id="actions" class="actions"></div>
    </main>
    <script src="page.js"></script>
  </body>
</html>
